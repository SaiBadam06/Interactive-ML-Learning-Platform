{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 100px 20px;">
    <div class="error-page">
        <h1 style="font-size: 6rem; color: var(--primary-color); margin-bottom: 20px;">404</h1>
        <h2 style="font-size: 2rem; margin-bottom: 20px;">Page Not Found</h2>
        <p style="font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 40px;">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-large" style="max-width: 300px;">
            <i class="fas fa-home"></i> Go Back Home
        </a>
    </div>
</div>
{% endblock %}
