{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 100px 20px;">
    <div class="error-page">
        <h1 style="font-size: 6rem; color: var(--danger-color); margin-bottom: 20px;">500</h1>
        <h2 style="font-size: 2rem; margin-bottom: 20px;">Internal Server Error</h2>
        <p style="font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 40px;">
            Something went wrong on our end. Please try again later.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-large" style="max-width: 300px;">
            <i class="fas fa-home"></i> Go Back Home
        </a>
    </div>
</div>
{% endblock %}
